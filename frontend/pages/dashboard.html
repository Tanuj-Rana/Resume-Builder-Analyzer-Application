<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ResumeAI Layout</title>
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* ----------------------------------
       SIDEBAR STYLES (Fixed Top/Bottom, Scrollable Middle)
    ---------------------------------- */
    .sidebar {
      width: 220px;
      background-color: #0b1120;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 14px 12px;
      flex-shrink: 0;
    }

    /* 1. FIXED TOP SECTION */
    .sidebar-header {
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 6px 12px 6px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background-color: #2563eb;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
    }

    .brand-text .title {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.1;
    }

    .brand-text .subtitle {
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .menu-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #475569;
      margin: 4px 10px 6px 10px;
      text-transform: uppercase;
    }

    /* 2. SCROLLABLE MIDDLE NAVIGATION SECTION */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      margin-right: -4px; /* Offset scrollbar spacing slightly */
      padding-right: 4px;
    }

    /* Custom thin scrollbar styling */
    .sidebar-nav::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .sidebar-nav::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .nav-item a i {
      font-size: 13px;
      width: 16px;
      text-align: center;
    }

    .nav-item a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active a {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }

    /* 3. FIXED BOTTOM SECTION */
    .sidebar-footer {
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.06);
      margin: 8px 6px;
    }

    /* Upgrade Card */
    .pro-card {
      background: linear-gradient(135deg, #4338ca 0%, #3b82f6 100%);
      border-radius: 12px;
      padding: 12px;
      margin: 8px 0;
      color: #ffffff;
    }

    .pro-card .crown-icon {
      color: #facc15;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .pro-card h4 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pro-card p {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .pro-btn {
      width: 100%;
      background-color: #ffffff;
      color: #2563eb;
      border: none;
      border-radius: 16px;
      padding: 7px 0;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .pro-btn:hover {
      background-color: #f1f5f9;
    }

    /* User Profile Bottom */
    .user-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 0 4px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
    }

    .logout-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .logout-btn:hover {
      color: #ffffff;
    }

    /* ----------------------------------
       HEADER STYLES
    ---------------------------------- */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      height: 52px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      gap: 8px;
      border-bottom: 1px solid #f1f5f9;
    }

    .header-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
      background-color: #ffffff;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .header-icon-btn:hover {
      background-color: #f8fafc;
    }

    .notification-dot {
      position: absolute;
      top: 6px;
      right: 7px;
      width: 6px;
      height: 6px;
      background-color: #2563eb;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e2e8f0;
      padding: 3px 10px 3px 3px;
      border-radius: 20px;
      cursor: pointer;
      background-color: #ffffff;
      transition: background 0.2s;
    }

    .profile-pill:hover {
      background-color: #f8fafc;
    }

    .profile-pill img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-pill span {
      font-size: 12.5px;
      font-weight: 600;
      color: #0f172a;
    }

    .profile-pill i {
      font-size: 10px;
      color: #64748b;
    }

    /* Blank Content Placeholder */
    .main-content {
      flex: 1;
      padding: 24px;
      background-color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR CONTAINER -->
  <aside class="sidebar">
    
    <!-- 1. FIXED TOP: BRAND & SECTION TITLE -->
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-logo">R</div>
        <div class="brand-text">
          <div class="title">ResumeAI</div>
          <div class="subtitle">BUILDER & ANALYZER</div>
        </div>
      </div>
      <div class="menu-label">MENU</div>
    </div>

    <!-- 2. SCROLLABLE MIDDLE: MENU ITEMS (Home to Learning Center) -->
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item active">
          <a href="#"><i class="fa-solid fa-border-all"></i> Home</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-regular fa-file-lines"></i> My Resumes</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-pen-nib"></i> Resume Builder</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-chart-simple"></i> ATS Analyzer</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-briefcase"></i> Job Matcher</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-paper-plane"></i> Cover Letters</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-layer-group"></i> Templates</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-graduation-cap"></i> Learning Center</a>
        </li>
      </ul>
    </nav>

    <!-- 3. FIXED BOTTOM: SETTINGS, UPGRADE BOX & USER PROFILE -->
    <div class="sidebar-footer">
      <div class="divider"></div>

      <!-- Settings Item -->
      <ul class="nav-list">
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
        </li>
      </ul>

      <!-- Upgrade Box -->
      <div class="pro-card">
        <i class="fa-solid fa-crown crown-icon"></i>
        <h4>Upgrade to Pro</h4>
        <p>Unlimited resumes, AI generation & expert reviews.</p>
        <button class="pro-btn">Upgrade — $12/mo</button>
      </div>

      <!-- Profile Bottom Bar -->
      <div class="user-footer">
        <div class="user-info">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Sarah Mitchell" class="user-avatar" />
          <span class="user-name">Sarah Mitchell</span>
        </div>
        <button class="logout-btn" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>

  </aside>

  <!-- MAIN AREA WITH HEADER -->
  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="header">
      <!-- Theme Toggle Button -->
      <button class="header-icon-btn">
        <i class="fa-regular fa-moon"></i>
      </button>

      <!-- Notification Bell -->
      <button class="header-icon-btn">
        <i class="fa-regular fa-bell"></i>
        <span class="notification-dot"></span>
      </button>

      <!-- User Profile Dropdown -->
      <div class="profile-pill">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Sarah Profile" />
        <span>Sarah</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </header>

    <!-- MAIN BODY CONTENT (LEFT BLANK) -->
    <main class="main-content">
      <!-- Content goes here -->
    </main>
  </div>

</body>
</html>
