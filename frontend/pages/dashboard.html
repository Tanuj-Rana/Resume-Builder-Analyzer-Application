<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ResumeAI Layout</title>
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- SIDEBAR CONTAINER -->
  <aside class="sidebar">
    <!-- 1. FIXED TOP: BRAND & SECTION TITLE -->
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-logo">R</div>
        <div class="brand-text">
          <div class="title">ResumeAI</div>
          <div class="subtitle">BUILDER & ANALYZER</div>
        </div>
      </div>
      <div class="menu-label">MENU</div>
    </div>

    <!-- 2. SCROLLABLE MIDDLE: MENU ITEMS (Home to Learning Center) -->
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item active">
          <a href="#"><i class="fa-solid fa-border-all"></i> Home</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-regular fa-file-lines"></i> My Resumes</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-pen-nib"></i> Resume Builder</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-chart-simple"></i> ATS Analyzer</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-briefcase"></i> Job Matcher</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-paper-plane"></i> Cover Letters</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-layer-group"></i> Templates</a>
        </li>
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-graduation-cap"></i> Learning Center</a>
        </li>
      </ul>
    </nav>

    <!-- 3. FIXED BOTTOM: SETTINGS, UPGRADE BOX & USER PROFILE -->
    <div class="sidebar-footer">
      <div class="divider"></div>

      <!-- Settings Item -->
      <ul class="nav-list">
        <li class="nav-item">
          <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
        </li>
      </ul>

      <!-- Upgrade Box -->
      <div class="pro-card">
        <i class="fa-solid fa-crown crown-icon"></i>
        <h4>Upgrade to Pro</h4>
        <p>Unlimited resumes, AI generation & expert reviews.</p>
        <button class="pro-btn">Upgrade — $12/mo</button>
      </div>

      <!-- Profile Bottom Bar -->
      <div class="user-footer">
        <div class="user-info">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Sarah Mitchell" class="user-avatar" />
          <span class="user-name">Sarah Mitchell</span>
        </div>
        <button class="logout-btn" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>

  </aside>

  <!-- MAIN AREA WITH HEADER -->
  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header class="header">
      <!-- Theme Toggle Button -->
      <button class="header-icon-btn">
        <i class="fa-regular fa-moon"></i>
      </button>

      <!-- Notification Bell -->
      <button class="header-icon-btn">
        <i class="fa-regular fa-bell"></i>
        <span class="notification-dot"></span>
      </button>

      <!-- User Profile Dropdown -->
      <div class="profile-pill">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80" alt="Sarah Profile" />
        <span>Sarah</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </header>

    <!-- MAIN BODY CONTENT (LEFT BLANK) -->
    <main class="main-content">
      <!-- Content goes here -->
    </main>
  </div>

</body>
</html>
