version: '3.8'

services:
  db:
    # You can specify a version like mysql:8.0 if needed
    image: mysql:latest
    container_name: my_mysql_db
    environment:
      # MySQL requires a root password to be set
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3306:3306"
    volumes:
      # Maps your local SQL files to the initialization directory
      - ./init-scripts:/docker-entrypoint-initdb.d/
      # Persists your database data locally so it isn't lost on restart
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: